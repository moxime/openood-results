logger:
  __default__: warning
  __main__: 
  logger:
  configdict:
  load: 
  table:
  filters:
  scores:

load:
  result_directory: ./results

  ood_csv: ood.csv
  csv_index:
    dataset: ood
    epoch: epoch
    phase: phase
  parse_dates: [date]

  config_yml: config.yml

  flash: True

  index_fill_values:
    epoch: 0
    epochs: 0
    it: 0
    margin: 0.
    mu_ood: null
    phase: none
    gasless: False
    pad_ext: none
    score_path: none

args:
  aliases:
    logger.__main__: [--logm]
    logger.__default__: [--log]
    load.result_directory: [-r]
    load.no_flash: [--reload]
  
  exclude:
    - args
    - load.config_keys
    - table.index_dependencies
    - load.index_fill_values
    - load.csv_index

scores:
  compute: True
  q:
    id: 
    ood: 
  fisher: False
  iqr: []
  mean: []
  std: []
  skew: []
  medcouple: []
  kurtosis: []
  max_compute: 20000
