table:
  exp_index:
    - exp
    - job
    - date
    - workers
    - path
    - has_scores
  hide:
    - epoch
    - oods
    - preproc

  show: []
  drop_unique: True
  show_dropped: True
  index_order: [set, net, ..., ood, phase, epoch, date, job]
  list_values:
  float_format: '{:.3g}'

  max_length: 200
    
  index_dependencies:
    beta: [s_ood]
    lr: [wd]

  columns_rename:
    FPR@95: fpr
    AUROC: auc
    ACC: acc
    AUPR_IN: aupr_in
    AUPR_OUT: aupr_out
    SCORES: scores
    ID_Q: id_q
    OOD_Q: ood_q
    ID_MEAN: id
    ID_STD: id_std
    ID_SKEW: id_skew
    ID_MEDCOUPLE: id_medcouple
    ID_KURTOSIS: id_kurt
    ID_IQR: id_iqr
    OOD_MEAN: ood
    OOD_STD: ood_std
    OOD_SKEW: ood_skew
    OOD_MEDCOUPLE: ood_medcouple
    OOD_KURTOSIS: ood_kurt
    OOD_IQR: ood_iqr
    FISHER: fisher

  columns:
    - fpr
    - auc
    - id_q
    - ood_q
    - id
    - id_std
    - ood
    - ood_std
    - fisher

  ops:
    op: [max]
    columns: []

  filters:
    __placeholder__:
      
  name:

  plot:
    max_figs: 16
    plots: []
    split_levels: 0
    hist_params:
      bins: 200
      histtype: step
    subdir: plots
      
  tex:
    filename: '' #/tmp/table.tex
    columns:
      fpr: FPR,
      auroc: AUROC,
    index:
      chunk:
        name: $N$
      grad:
        name: $\nabla$
        values:
          penultimate: pen
        ood_period:
          name: $T_{\text{OOD}}$
        mu_alt:
          name: $\mu_{\text{alt}}$
