table:
  hidden_index:
    - exp
    - job
    - date
    - oods
    - workers
    - epoch
    - path
    - has_scores

  show: []
  drop_unique: True
  show_dropped: True
  index_order: ['set', 'net', '...', 'ood', 'phase', 'epoch', 'date', 'job']
  list_values:
  
  index_dependencies:
    beta: [s_ood]
    epochs: [it]
    lr: [wd]

  columns:
    FPR@95: fpr
    AUROC: auc
    ACC: 
    AUPR_IN:
    AUPR_OUT:
    SCORES: 

  create_col:
    iter: \chunk * (1 + max(\id_pad, 0) + max(\ood_pad, 0) + \self_pad) * \epochs / \batch_size
  
