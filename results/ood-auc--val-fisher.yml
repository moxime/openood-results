concat: [ood, val]


val:

  hide: [phase]

  filters:
    partial: [-1.]
    ood: [val]
    phase-: [2end]
    ood_period: [1.]
    ood_ratio: [0.1]

  ops: [max:fisher]


ood:

  hide: [phase]

  filters:
    partial: [0., 1.]
    ood-: [val]    
    phase: [2end]
    mixes-: [old_mix]
    ood_period: [1.]
    ood_ratio: [0.1]
    
full:

  columns: [fpr--.*, auc--.*, fisher--.*, fpr, auc, fisher, it_p--.*, partial--.*] 

  hide: [phase, epoch, partial, mixes] #, it_p]

  # ops: [unstack:ood:it_p, stack:ood:it_p]
   
