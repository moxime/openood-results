# look for the value of beta that maximises fisher on val and gives auc yield on oods
concat: [ood, val]


val:

  hide: [phase]

  filters:
    partial: [-1.]
    ood: [val]
    phase-: [2end]

  ops: [max:fisher]


ood:

  hide: [phase]

  filters:
    partial-: [-1.]
    ood-: [val]
    phase: [2end]

full:

  columns: [fpr--.*, auc--.*, fisher--.*, fpr, auc, fisher] 

  hide: [mixes, phase, epoch, partial] #, it_p]
  show: [ood]

  ops: [unstack:ood:it_p, max:fisher--val] #, stack:ood]
   
